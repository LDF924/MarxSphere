# electron-builder.yml — MarxSphere 桌面端打包配置（2026-08-27: 跨平台 win/mac/linux）
appId: com.marxsphere.desktop
productName: MarxSphere
directories:
  output: release
  buildResources: build

files:
  - electron/dist/**/*

extraResources:
  # 主资源（electron-builder 默认排除 node_modules, 需单独条目）
  - from: resources/sag/dist
    to: sag/dist
    filter:
      - "**/*"
  - from: resources/sag/scripts
    to: sag/scripts
    filter:
      - "**/*"
  - from: resources/sag/migrations
    to: sag/migrations
    filter:
      - "**/*"
  - from: resources/sag/data
    to: sag/data
    filter:
      - "**/*"
  - from: resources/sag/evaluation
    to: sag/evaluation
    filter:
      - "**/*"
  - from: resources/sag/reports
    to: sag/reports
    filter:
      - "**/*"
  - from: resources/sag/docs
    to: sag/docs
    filter:
      - "**/*"
  - from: resources/sag/web
    to: sag/web
    filter:
      - "**/*"
  - from: resources/sag/node_modules.zip
    to: sag/node_modules.zip
  - from: resources/sag/education-templates
    to: sag/education-templates
    filter:
      - "**/*"
  - from: resources/sag/skills
    to: sag/skills
    filter:
      - "**/*"
  - from: resources/sag/docker-compose.yml
    to: sag/docker-compose.yml
  # V397: 开源合规文件随包携带
  - from: resources/sag/NOTICE
    to: sag/NOTICE
  - from: resources/sag/THIRD_PARTY_NOTICES.md
    to: sag/THIRD_PARTY_NOTICES.md
  - from: resources/sag/LICENSE
    to: sag/LICENSE
  - from: resources/sag/THIRD_PARTY_LICENSES
    to: sag/THIRD_PARTY_LICENSES
    filter:
      - "**/*"

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico

# 2026-08-27: 跨平台支持（ScienceX 理念: macOS/Windows/Linux）
mac:
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  category: public.app-category.education
  icon: build/icon.icns

linux:
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
  category: Education
  icon: build/icon.png

nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: MarxSphere
  installerLanguages:
    - zh_CN
  include: build/installer.nsh

# 排除 node_modules（后端 dist 已编译, 依赖在 dist 内 node_modules 由 extraResources 携带）
npmRebuild: false
