services:
  postgres:
    # daocloud 镜像（国内可直连；海外用户可改回 pgvector/pgvector:pg16）
    image: docker.m.daocloud.io/pgvector/pgvector:pg16
    container_name: sag_lite_postgres
    environment:
      POSTGRES_DB: sag_lite
      POSTGRES_USER: sag_lite
      POSTGRES_PASSWORD: sag_lite_pass
    ports:
      - "5540:5432"
    volumes:
      - sag_lite_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sag_lite -d sag_lite"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Neo4j(Graphiti 11001 / Cognee 11003) 已移除 docker 空壳 — 图谱数据在本地原生 Neo4j 实例
  # (C:\Users\HUAWEI\neo4j\neo4j-community-5.26.27[-cognee]), 端口 11001/11003 由本地实例占用
  # 启动: 见 scripts/sag-bootstrap.sh start_neo4j(); 代码 neo4j-query.ts 直连 bolt://127.0.0.1:11001/11003 不受影响

volumes:
  sag_lite_pgdata:
