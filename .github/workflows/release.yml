name: Release

# 打 tag（v*）时自动构建桌面端安装包并上传 GitHub Release
# 用法: git tag v0.3.0 && git push origin v0.3.0
# 说明: 桌面端 NSIS 打包为 Windows 生态（bsdtar/electron-builder），runner 用 windows-latest

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build vendor packages (pdf2obsidian)
        run: |
          cd vendor/pdf2obsidian
          corepack enable
          pnpm install --no-frozen-lockfile
          pnpm -r --filter "./packages/**" build

      # release.mjs 内部完成: 构建 API+Web+electron → 准备 resources → NSIS 打包 → 创建 Release → 上传安装包
      # SAG-main 本机同步步骤在 CI 环境自动跳过（目录不存在）
      - name: Build desktop + publish Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release.mjs ${{ github.ref_name }}
