name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build vendor packages (pdf2obsidian dist is gitignored)
        run: |
          cd vendor/pdf2obsidian
          npm install --no-audit --no-fund
          npx tsc -p packages/providers/tsconfig.json
          npx tsc -p packages/core/tsconfig.json
          npx tsc -p packages/pipeline/tsconfig.json
          npx tsc -p packages/tasks/tsconfig.json

      - name: Typecheck (backend + frontend)
        run: npm run typecheck

      - name: Unit tests (154)
        run: npm test

      - name: Frontend build
        run: npx vite build
