name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: sag_lite
          POSTGRES_USER: sag_lite
          POSTGRES_PASSWORD: sag_lite_pass
        ports:
          - 5540:5432
        options: >-
          --health-cmd "pg_isready -U sag_lite -d sag_lite"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # ⚠ 必须是 22, 不能是 20。2026-09-23 定位: CI 从 9-11 起连续红了 13 天,
          #   其中一条根因就是这里 —— `pdfjs-dist@6`(9-15 引入) 的 engines 写着
          #   `node >=22.13.0 || >=24`, 它内部用了 `Promise.withResolvers()`,
          #   而那是 Node 22 才有的 API。在 Node 20 上表现为:
          #     TypeError: Promise.withResolvers is not a function
          #   版本号要与 package.json 的 engines 以及本地保持一致(本地实测 v24 通过)。
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build vendor packages (pdf2obsidian dist is gitignored, pnpm workspace)
        run: |
          cd vendor/pdf2obsidian
          corepack enable
          pnpm install --no-frozen-lockfile
          pnpm -r --filter "./packages/**" build

      - name: Typecheck (backend + frontend)
        run: npm run typecheck

      - name: Setup Python (v399 integration tests deps)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install python deps
        # ⚠ 这份清单要能覆盖 **CI 真跑到的每一条 python 路径**, 否则失败会以别种面貌出现。
        #   2026-09-23 系统排查(CI 连续红了 13 天)把每一处挖出来对了一遍:
        #     · statsmodels      — scripts/empirical_runner.py 的 ologit 分支
        #                          (`from statsmodels.miscmodels.ordinal_model import OrderedModel`)。
        #                          少了它 → ImportError 被外层 except 吞掉 → tables 为空 →
        #                          用例挂在 `expected 0 to be greater than 0` —— **长得像断言失败**。
        #     · openpyxl         — scripts/xlsx2csv.py。少了它 → /api/files/upload 对 .xlsx
        #                          返回 400「xlsx 解析失败」→ 统计台的上传整条链断掉。
        #     · python-docx      — scripts/empirical_table_docx.py 与 review_annotations.py
        #                          (`from docx import Document`)。少了它 → /paper-outline/export
        #                          抛 Python traceback / 502 → 编辑器导出 Word 与导入 Word 双双失败。
        #     · matplotlib       — scripts/jupyter_runner.py 与 viz_runner.py(绘图)。
        #   本地之所以全过: .env 的 EMPIRICAL_PYTHON 指向一个装了全套的 venv —— **那只对本机成立**,
        #   CI 用的是 setup-python 的干净解释器。**改这里的清单时, 请对着上面的脚本再核一遍。**
        run: pip install pandas scipy requests numpy statsmodels openpyxl python-docx matplotlib

      - name: Unit tests (154)
        env:
          DATABASE_URL: postgres://sag_lite:sag_lite_pass@localhost:5540/sag_lite
          # 外部学术 API(OpenAlex/Unpaywall/Crossref)在 CI runner 共享 IP 上不可靠 → 跳过 [network] 用例
          # 网络用例已在本地真实网络验证(23/23)
          SKIP_NETWORK_TESTS: "1"
        run: npm test

      - name: Frontend build (React 外壳 + Vue 子应用)
        run: |
          npx vite build
          # Vue 子应用必须单独构建, 产物落 web/dist/soc —— 根 vite build 不含它。
          # 少了这步, 外壳里那 5 个 FusionPanel 的 iframe 会指向不存在的 /soc/index.html,
          # 下面的 UI 门禁(fusion-tabs)必然失败。
          npm run build:socialsci-vue

      - name: Start server for E2E
        env:
          DATABASE_URL: postgres://sag_lite:sag_lite_pass@localhost:5540/sag_lite
          LLM_API_KEY: dummy
          EMBEDDING_API_KEY: dummy
          HTTP_PORT: 4173
          # ⚠ 2026-09-27 补。**必须显式设**, 不能指望它回退到 PATH 里的 python ——
          #   `empirical-service.ts` 与 `empirical-pipeline-service.ts` 用的是
          #   `process.env.EMPIRICAL_PYTHON || ""`, 那个空串是**刻意的守卫**
          #   ("V412: PYTHON 未配置时直接返回未安装, 避免 execFile("") 报错")。
          #   于是没配 = 实证台整条 python 通路不起作用(实证 run 起不来 → 结果不落库 →
          #   写作舱「本章依据」列出的运行恒为空)。
          #   绝大多数同类服务(statistics-job / viz-exec / citation-verify / jupyter)
          #   都写成 `|| "python"`, 只有这两个是空串 —— 所以这条**只在这两个服务上**会踩。
          #
          #   代价(实测): 漏了它 CI 会红 96 小时以上, 而且症状**完全指错方向** ——
          #   probe-research-evidence 唯一的失败是 `runs=0`, 看着像绑定/接口的问题,
          #   实际是"后端没有可用的 python"。本地因为 .env 里指着一个装好的 venv 而全过。
          EMPIRICAL_PYTHON: python
        run: |
          echo "--- PG 连通性检查 ---"
          node -e "const {Client}=require('pg');const c=new Client({connectionString:process.env.DATABASE_URL});c.connect().then(()=>c.query('select 1').then(r=>{console.log('PG OK:',r.rows[0]);process.exit(0)}).catch(e=>{console.error('PG QUERY FAIL:',e.message);process.exit(1)})).catch(e=>{console.error('PG CONNECT FAIL:',e.message);process.exit(1)})"
          echo "--- 启动服务 ---"
          npx tsx src/index.ts > /tmp/server.log 2>&1 &
          for i in $(seq 1 24); do
            if curl -sf http://localhost:4173/health 2>/dev/null | grep -q '"db":"up"'; then
              echo "server ready after ~$((i * 5))s (db up)"
              exit 0
            fi
            sleep 5
          done
          echo "server failed to start, log tail:"; tail -40 /tmp/server.log
          # 失败时把日志写进文件供 artifact 收集（日志 API 403 时仍可下载）
          cp /tmp/server.log /tmp/server-fail.log 2>/dev/null || true
          exit 1
        shell: bash

      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-log
          path: /tmp/server-fail.log

      - name: UI 视图门禁 (真浏览器)
        env:
          DATABASE_URL: postgres://sag_lite:sag_lite_pass@localhost:5540/sag_lite
          HTTP_PORT: 4173
        run: |
          # 原先这里是 `npx playwright test` —— 仓库里既没有 playwright.config.* 也没有 e2e 目录,
          # 命令找到 0 个测试却 exit 0(而且它按 *.test.ts 把 vitest 的文件捞进来解析失败),
          # 所以这一步一直是**空转的绿灯**。换成真正有内容的 UI 门禁。
          #
          # 前置: 服务由上面的 "Start server for E2E" 步骤在**同一个 job 的后台**起着
          # (那个步骤跑完就返回, 进程还在)。这里先确认 4173 仍然可达, 免得门禁在
          # "服务没起来"时报出一堆莫名其妙的视图断言失败。
          # 默认组是"配置面"断言(视图是否挂对子应用 / 页签与动作卡是否齐全), 不依赖历史数据;
          # 需要往期审稿等真实数据的套件用 `npm run verify:ui:all` 跑。
          for i in $(seq 1 12); do
            curl -sf http://localhost:4173/health >/dev/null && break
            echo "等 4173… ($i)"; sleep 5
          done
          curl -sf http://localhost:4173/health >/dev/null || { echo "4173 不可达, UI 门禁无法运行"; exit 1; }
          # 门禁脚本自己 spawn 浏览器并连 DevTools 协议。原先是 `npx playwright test` 顺带
          # install 的; 现在那条命令去掉了, 这里显式装一次。
          npx playwright install --with-deps chromium
          # ⚠ 输出同时落盘一份: 这个动作的日志**需要仓库 admin 权限**才能从 API 拉,
          #   而失败时 annotation 只给一句"Process completed with exit code 1" —— 没有断言行号,
          #   等于"知道红了, 不知道红在哪"。写成文件后由下面的 artifact 步骤带走, 谁都能下。
          #
          # ⚠⚠ 2026-09-24 补一道**更可靠的兜底**: artifact 要鉴权才能下载(匿名 401),
          #   而失败日志曾经只有 1.6KB(那是 `process.exit(1)` 丢掉未冲刷 stdout 所致, 已修)。
          #   但即便修了, 想让"失败原因"稳定地到达人眼前, 最稳的还是把它**打进 annotation** ——
          #   annotations 是**匿名可读**的(实测), 一条 `::error::` 里塞进最后若干行日志,
          #   在 PR/commit 页面上直接看得到, 不用下载任何东西。
          #   这里只加观测, 不加时长。
          set -o pipefail
          # ⚠ 必须 `set +e` 包住这一句: GitHub Actions 的 `run` 默认是 `bash -e`,
          #   不加的话 `npm run verify:ui | tee` 一失败**脚本立刻终止** ——
          #   下面取退出码与打 annotation 的几行**根本执行不到**。
          #   实测: 前一版就这么写, 失败时 annotation 里只有 GitHub 自己那句
          #   "Process completed with exit code 1", 我想补的那两条一条都没出现。
          set +e
          npm run verify:ui 2>&1 | tee /tmp/verify-ui.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            # 尽量把**失败原因**塞进 annotation(匿名可读, 不用下载任何东西)。
            # ⚠ grep 必须覆盖 `FAIL` —— 环境哨兵的失败行就是 `FAIL  <中文名> — <详情>`,
            #   不含 ❌; 只 grep ❌ 会把"哨兵拦下了"这种最可能的失败整段漏掉。
            echo "::error title=UI 门禁失败::$(grep -E 'FAIL|❌|失败:|套通过|套全部通过|项异常' /tmp/verify-ui.log | tail -10 | tr '\n' '~' | cut -c1-6000)"
            echo "::error title=逐套结论::$(grep -E '^(✅|❌) ' /tmp/verify-ui.log | tail -30 | tr '\n' '~' | cut -c1-6000)"
          fi
          exit $rc
        shell: bash

      # 门禁失败时把**门禁自己的输出**也带出来(与上面的 server-log 同理)
      - name: Upload gate log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-ui-log
          path: /tmp/verify-ui.log
          if-no-files-found: ignore
